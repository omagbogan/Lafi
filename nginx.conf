server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip pour accélérer le chargement
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Téléchargement direct de l'APK Android
    location /lafi.apk {
        add_header Content-Disposition 'attachment; filename="lafi.apk"';
        add_header Content-Type 'application/vnd.android.package-archive';
        try_files /lafi.apk =404;
    }

    # Redirection vers l'API backend FastAPI
    location ~ ^/(auth|articles|ai|orders|customers|shops|admin|health|uploads|docs|openapi.json) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25M;
    }

    # Routage Single Page Application (Expo Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

